<div class="clearance-check-container">
  <h2>Check Parking Clearance</h2>

  <div class="mt-6 text-center">
    <!-- Go Back Button -->
    <button
      type="button"
      (click)="goBack()"
      class="bg-gradient-to-r from-gray-400 to-gray-600 text-white py-2 px-6 rounded-lg text-lg font-semibold hover:from-gray-500 hover:to-gray-700 transition-all shadow-md hover:shadow-lg"
    >
      Go Back
    </button>
  </div>

  <!-- Image Path Input -->
  <div class="mt-6">
    <input type="text" [(ngModel)]="imagePath" placeholder="Enter image path" class="w-full p-3 border rounded-lg" />
    <button (click)="checkPlate(imagePath)" class="mt-4 bg-gradient-to-r from-blue-500 to-blue-700 text-white py-2 px-6 rounded-lg text-lg font-semibold hover:from-blue-700 hover:to-blue-900 transition-all shadow-lg">
      Check Plate
    </button>
  </div>

  <!-- Plate Status -->
  <div *ngIf="plate">
    <p><strong>Plate:</strong> {{ plate }}</p>
    <p><strong>Status:</strong> {{ status }}</p>
  </div>
</div>
