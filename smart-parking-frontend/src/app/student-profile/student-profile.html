<div class="flex items-center justify-center h-screen bg-gradient-to-br from-yellow-200 to-yellow-400">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-96 transform transition-all hover:scale-105 hover:shadow-3xl">
    <img src="../../assets/logo.jpg" alt="TAMUK Logo" class="w-24 mx-auto mb-4 drop-shadow-lg">
    <h2 class="text-3xl font-extrabold text-center text-blue-900 mb-6">Profile</h2>

    <div class="text-left space-y-4 text-lg text-gray-800">
      <p><strong>👤 Username:</strong> {{ username }}</p>
      <p><strong>📧 Email:</strong> {{ email }}</p>

      <div class="flex items-center justify-between">
        <p><strong>🚗 License Plate:</strong> {{ licensePlate }}</p>
        <button
          (click)="goToUpdateVehicleRegistration()"
          class="text-sm text-blue-700 font-semibold hover:underline hover:text-blue-900">
          Change
        </button>
      </div>

      <div class="flex items-center justify-between">
        <p><strong>📱 Phone:</strong> {{ phone }}</p>
        <button
          (click)="goToUpdatePhoneNumber()"
          class="text-sm text-blue-700 font-semibold hover:underline hover:text-blue-900">
          Change
        </button>
      </div>
    </div>

    <button 
      (click)="goToStudentMenu()"
      class="mt-6 w-full bg-blue-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-800 transition-all shadow-lg hover:shadow-xl">
      Back to Menu
    </button>
  </div>
</div>
