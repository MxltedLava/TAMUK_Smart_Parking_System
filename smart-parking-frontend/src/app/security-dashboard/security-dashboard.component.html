<div class="security-dashboard">
    <h2>🚨 Unauthorized Parking Alerts</h2>

    <div class="mt-6 text-center">
      <button
        type="button"
        onclick="window.location.href='http://127.0.0.1:5502/smart-parking-frontend/src/app/employee-menu/employee-menu.html'"
        class="bg-gradient-to-r from-gray-400 to-gray-600 text-white py-2 px-6 rounded-lg text-lg font-semibold hover:from-gray-500 hover:to-gray-700 transition-all shadow-md hover:shadow-lg"
      >
        Go Back
      </button>
    </div>
  
    <table *ngIf="alerts.length > 0">
      <thead>
        <tr>
          <th>Plate</th>
          <th>Lot</th>
          <th>Time</th>
          <th>Image</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alert of alerts">
          <td>{{ alert.plate_read }}</td>
          <td>{{ alert.lot }}</td>
          <td>{{ alert.timestamp }}</td>
          <td>
            <img [src]="alert.image_path" width="100" *ngIf="alert.image_path.includes('media')">
          </td>
        </tr>
      </tbody>
    </table>
  
    <p *ngIf="alerts.length === 0">✅ No unauthorized attempts detected.</p>
  </div>
