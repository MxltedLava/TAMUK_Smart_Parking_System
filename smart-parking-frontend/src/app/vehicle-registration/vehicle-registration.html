<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-yellow-100 to-yellow-300">
  <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md text-center">
    <img src="../../assets/logo.jpg" alt="TAMUK Logo" class="w-24 mx-auto mb-6 drop-shadow-lg">
    <h1 class="text-2xl font-bold text-blue-900 mb-6">Register Your Vehicle</h1>

    <form (ngSubmit)="onRegister()" #vehicleForm="ngForm" class="space-y-4">
      <input 
        type="text" 
        name="licensePlate" 
        [(ngModel)]="vehicle.licensePlate"
        placeholder="License Plate Number" 
        class="w-full p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
        required>

      <input 
        type="text" 
        name="make" 
        [(ngModel)]="vehicle.make"
        placeholder="Vehicle Make (e.g., Toyota)" 
        class="w-full p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
        required>

      <input 
        type="text" 
        name="model" 
        [(ngModel)]="vehicle.model"
        placeholder="Vehicle Model (e.g., Corolla)" 
        class="w-full p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
        required>

      <input 
        type="number" 
        name="year" 
        [(ngModel)]="vehicle.year"
        placeholder="Year (e.g., 2021)" 
        class="w-full p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
        required>

      <input 
        type="text" 
        name="color" 
        [(ngModel)]="vehicle.color"
        placeholder="Color (e.g., Red)" 
        class="w-full p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
        required>

      <button 
        type="submit" 
        class="w-full bg-blue-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Register Vehicle
      </button>
    </form>

    <button 
      type="button" 
      (click)="goBackToMenu()"
      class="w-full bg-gray-300 text-gray-800 py-2 rounded-lg font-semibold hover:bg-gray-400 transition">
      Back to Student Menu
    </button>
  </div>
</div>
