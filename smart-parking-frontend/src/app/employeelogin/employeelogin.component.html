<div class="flex items-center justify-center h-screen bg-gradient-to-br from-yellow-200 to-yellow-400">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-96 transform transition-all hover:scale-105 hover:shadow-3xl">
    <img src="../../assets/logo.jpg" alt="TAMUK Logo" class="w-24 mx-auto mb-4 drop-shadow-lg">
    <h2 class="text-3xl font-extrabold text-center text-blue-900 mb-6">Employee Login</h2>
    
    <form (submit)="onLogin($event)" class="space-y-5">
      <div class="relative">
        <input type="text" [(ngModel)]="username" placeholder="Username" 
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md transition-all duration-300" required />
        <span class="absolute right-3 top-3 text-gray-400 text-lg">&#128100;</span>
      </div>
      
      <div class="relative">
        <input type="password" [(ngModel)]="password" placeholder="Password" 
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md transition-all duration-300" required />
        <span class="absolute right-3 top-3 text-gray-400 text-lg">&#128274;</span>
      </div>

      <button type="submit" 
        class="w-full bg-gradient-to-r from-blue-500 to-blue-700 text-white py-3 rounded-lg text-lg font-semibold hover:from-blue-700 hover:to-blue-900 transition-all shadow-lg hover:shadow-xl">
        Login
      </button>
      
      <!-- Go Back Button -->
      <button type="button" 
        onclick="window.location.href='http://127.0.0.1:5502/smart-parking-frontend/src/app/login/login.component.html'"
        class="w-full py-3 px-6 rounded-lg bg-gray-600 text-white text-lg font-semibold hover:bg-gray-800 transition-all shadow-md mt-4">
        Go Back
      </button>

      <!-- Bypass Button -->
      <button type="button" 
        onclick="window.location.href='http://127.0.0.1:5502/smart-parking-frontend/src/app/employee-menu/employee-menu.html'"
        class="w-full py-3 px-6 rounded-lg bg-green-600 text-white text-lg font-semibold hover:bg-green-800 transition-all shadow-md mt-4">
        Bypass to Employee Menu
      </button>
    </form>
  </div>
</div>
