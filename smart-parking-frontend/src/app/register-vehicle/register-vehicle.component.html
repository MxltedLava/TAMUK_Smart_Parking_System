<div class="vehicle-registration">
    <h2>🚗 Registered Vehicles</h2>
    <div class="mt-6 text-center">
        <button
          type="button"
          onclick="window.location.href='http://192.168.0.101:1276/smart-parking-frontend/src/app/employee-menu/employee-menu.html'"
          class="bg-gradient-to-r from-gray-400 to-gray-600 text-white py-2 px-6 rounded-lg text-lg font-semibold hover:from-gray-500 hover:to-gray-700 transition-all shadow-md hover:shadow-lg"
        >
          Go Back
        </button>
      </div>
  
    <table *ngIf="vehicles.length > 0">
      <thead>
        <tr>
          <th>Owner</th>
          <th>Vehicle</th>
          <th>License Plate</th>
          <th>Registration Expiry</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let vehicle of vehicles">
          <td>{{ vehicle.owner }}</td>
          <td>{{ vehicle.make }} {{ vehicle.model }}</td>
          <td>{{ vehicle.plate }}</td>
          <td>{{ vehicle.expiry }}</td>
          <td [ngClass]="vehicle.status">{{ vehicle.status }}</td>
        </tr>
      </tbody>
    </table>
  
    <p *ngIf="vehicles.length === 0">No registered vehicles found.</p>
  </div>
