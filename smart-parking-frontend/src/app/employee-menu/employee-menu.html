<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-yellow-100 to-yellow-300">
  <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md text-center">
    <img src="../../assets/logo.jpg" alt="TAMUK Logo" class="w-24 mx-auto mb-6 drop-shadow-lg">
    <h1 class="text-3xl font-bold text-blue-900 mb-8">Employee Menu</h1>

    <div class="space-y-4">
      <!-- Security Dashboard Button -->
      <button 
        (click)="goToSecurityDashboard()"
        class="w-full py-3 px-6 rounded-lg bg-blue-600 text-white text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Security Dashboard
      </button>

      <!-- Vehicle Registration Button -->
      <button 
        (click)="goToVehicleRegistration()"
        class="w-full py-3 px-6 rounded-lg bg-blue-600 text-white text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Vehicle Registration
      </button>

      <!-- Clearance Check Button -->
      <button 
        (click)="goToClearanceCheck()"
        class="w-full py-3 px-6 rounded-lg bg-blue-600 text-white text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Clearance Check
      </button>

      <!-- Parking History Button -->
      <button 
        (click)="goToParkingHistory()"
        class="w-full py-3 px-6 rounded-lg bg-blue-600 text-white text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Parking History
      </button>

      <!-- Live License Plate Footage Feed Button -->
      <button 
        (click)="goToLiveFootage()"
        class="w-full py-3 px-6 rounded-lg bg-blue-600 text-white text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Live License Plate Footage Feed
      </button>

      <!-- Log Out Button -->
      <button 
        (click)="goToLogin()"
        class="w-full py-3 px-6 rounded-lg bg-red-600 text-white text-lg font-semibold hover:bg-red-800 transition-all shadow-md mt-6">
        Log Out
      </button>
    </div>
  </div>
</div>
