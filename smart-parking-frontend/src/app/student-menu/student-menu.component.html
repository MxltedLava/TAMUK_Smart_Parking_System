<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-yellow-100 to-yellow-300">
  <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md text-center">
    <img src="../../assets/logo.jpg" alt="TAMUK Logo" class="w-24 mx-auto mb-6 drop-shadow-lg">
    <h1 class="text-3xl font-bold text-blue-900 mb-4">Student Menu</h1>

    <div class="space-y-4">

      <!-- Parking Map Button -->
      <button 
        (click)="goToMap()"
        class="w-full py-3 px-6 rounded-lg bg-blue-600 text-white text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Parking Map
      </button>

      <!-- Register Vehicle Button -->
      <button 
        (click)="goToVehicleRegistration()"
        class="w-full py-3 px-6 rounded-lg bg-green-600 text-white text-lg font-semibold hover:bg-green-800 transition-all shadow-md">
        Register Your Vehicle
      </button>

      <!-- Profile Button -->
      <button 
        (click)="goToProfile()"
        class="w-full py-3 px-6 rounded-lg bg-yellow-500 text-white text-lg font-semibold hover:bg-yellow-700 transition-all shadow-md">
        Profile
      </button>

      <!-- Log Out Button -->
      <button 
        (click)="logout()"
        class="w-full py-3 px-6 rounded-lg bg-blue-600 text-white text-lg font-semibold hover:bg-blue-800 transition-all shadow-md">
        Log Out
      </button>

      <!-- Vehicle Registration Status -->
      <p *ngIf="isVehicleRegistered; else notVehicleRegistered" class="text-green-600 font-semibold text-lg mb-2">
        ✅ Vehicle Status: Registered
      </p>
      <ng-template #notVehicleRegistered>
        <p class="text-red-600 font-semibold text-lg mb-2">
          ❌ Vehicle Status: Not Registered
        </p>
      </ng-template>

      <!-- Phone Number Registration Status -->
      <p *ngIf="isPhoneRegistered; else notPhoneRegistered" class="text-green-600 font-semibold text-lg mb-2">
        ✅ Phone Number Status: Registered
      </p>
      <ng-template #notPhoneRegistered>
        <p class="text-red-600 font-semibold text-lg mb-2">
          ❌ Phone Number Status: Not Registered
        </p>
      </ng-template>

    </div>
  </div>
</div>
