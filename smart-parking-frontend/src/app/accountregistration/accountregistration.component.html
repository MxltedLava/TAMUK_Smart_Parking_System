<div class="flex items-center justify-center h-screen bg-gradient-to-br from-yellow-200 to-yellow-400">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-96 transform transition-all hover:scale-105 hover:shadow-3xl">
    <img src="../../assets/logo.jpg" alt="TAMUK Logo" class="w-24 mx-auto mb-4 drop-shadow-lg">
    <h2 class="text-3xl font-extrabold text-center text-blue-900 mb-6">Create Your Account</h2>

    <form (ngSubmit)="onRegister()" class="space-y-5">
      <!-- Username -->
      <div class="relative">
        <input type="text" [(ngModel)]="username" name="username" placeholder="Username"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md transition-all duration-300" required />
        <span class="absolute right-3 top-3 text-gray-400 text-lg">&#128100;</span>
      </div>

      <!-- School Email -->
      <div class="relative">
        <input type="email" [(ngModel)]="email" name="email" placeholder="School Email (@students.tamuk.edu)" 
          pattern="^[a-zA-Z0-9._%+-]+@students\.tamuk\.edu$"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md transition-all duration-300" required />
        <span class="absolute right-3 top-3 text-gray-400 text-lg">&#9993;</span>
      </div>

      <!-- Password -->
      <div class="relative">
        <input type="password" [(ngModel)]="password" name="password" placeholder="Create Password"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md transition-all duration-300" required />
        <span class="absolute right-3 top-3 text-gray-400 text-lg">&#128274;</span>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md transition-all duration-300" required />
        <span class="absolute right-3 top-3 text-gray-400 text-lg">&#128274;</span>
      </div>

      <!-- Register Button -->
      <button type="submit"
        class="w-full bg-gradient-to-r from-blue-500 to-blue-700 text-white py-3 rounded-lg text-lg font-semibold hover:from-blue-700 hover:to-blue-900 transition-all shadow-lg hover:shadow-xl">
        Register
      </button>
    </form>

    <!-- Back to login -->
    <p class="text-center mt-6 text-gray-800 text-sm">Already have an account? 
      <a href="#" (click)="goToLogin()"
      class="text-blue-700 font-semibold hover:underline hover:text-blue-900 transition-all">
        Log in here
      </a>
    </p>
  </div>
</div>
